[build-system]
# __init__.__version__ を動的バージョンとして使用
# requires = ["hatchling>=1.25"]
requires = ["hatchling>=1.25", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "anysolv-tutorial"
dynamic = ["version"]
dependencies = ["typing_extensions >= 4.5; python_version < '3.10'"]
requires-python = ">=3.9"
authors = [{ name = "yu9824" }]
maintainers = [{ name = "yu9824" }]
description = ""
readme = { file = "README.md", content-type = "text/markdown" }
# https://spdx.org/licenses/
license = "MIT"
license-files = ["LICEN[CS]E*"]
keywords = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
test = ["pytest"]
dev = ["build"]
optional = ["colorlog", "tqdm"]
docs = [
    "sphinx",
    "myst-parser",
    "myst-nb",
    "sphinx-book-theme",
    "jupyter-sphinx",
]
# gui = ["TkEasyGUI"]

[project.urls]
Homepage = "https://github.com/yu9824/anysolv-tutorial"
# Documentation = "https://yu9824.github.io/anysolv-tutorial/"
# PyPI = "https://pypi.org/project/anysolv-tutorial/"
Source = "https://github.com/yu9824/anysolv-tutorial"
Tracker = "https://github.com/yu9824/anysolv-tutorial/issues"
"Release Notes" = "https://github.com/yu9824/anysolv-tutorial/releases"
# Changelog = "https://github.com/yu9824/anysolv-tutorial/blob/main/CHANGELOG.md"

# [project.scripts]
# anysolv-tutorial = "anysolv_tutorial.__main__:entrypoint"

# [project.gui-scripts]
# anysolv-tutorial-gui = "anysolv_tutorial:main_gui"

# src レイアウトのパッケージ検出設定
[tool.hatch.build.targets.wheel]
packages = ["src/anysolv_tutorial"]

[tool.hatch.version]
# __init__.__version__ を動的バージョンとして使用
# path = "src/anysolv_tutorial/__init__.py"
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/anysolv_tutorial/_version.py"

[tool.hatch.version.raw-options]
root = "../../../"
