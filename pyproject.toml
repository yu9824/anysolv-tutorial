# https://packaging.python.org/ja/latest/guides/writing-pyproject-toml/
[build-system]
# __init__.__version__ を動的バージョンとして使用
# requires = ["setuptools>=77.0.3"]
requires = ["setuptools>=77.0.3", "setuptools-scm[toml]>=7"]
build-backend = "setuptools.build_meta"

[project]
name = "anysolv-tutorial"
dynamic = ["version"]
dependencies = [
    "fairchem-core[extras,ray,torchsim]==2.23.0",
    "anysolv[ase,gpu]~=0.1.0",
]
requires-python = ">= 3.11"
authors = [{ name = "yu9824" }]
maintainers = [{ name = "yu9824" }]
description = ""
readme = { file = "README.md", content-type = "text/markdown" }
# https://spdx.org/licenses/
license = "MIT"
license-files = ["LICEN[CS]E*"]
keywords = []
# https://pypi.org/classifiers/
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
] # https://pypi.org/classifiers/

[project.optional-dependencies]
test = ["pytest"]
dev = ["build"]
optional = ["colorlog", "tqdm", "joblib"]
docs = [
    "sphinx",
    "myst-parser",
    "myst-nb",
    "sphinx-book-theme",
    "jupyter-sphinx",
]
# gui = ["TkEasyGUI"]

[project.urls]
Homepage = "https://github.com/yu9824/anysolv-tutorial"
# Documentation = "https://yu9824.github.io/anysolv-tutorial/"
# PyPI = "https://pypi.org/project/anysolv-tutorial/"
Source = "https://github.com/yu9824/anysolv-tutorial"
Tracker = "https://github.com/yu9824/anysolv-tutorial/issues"
"Release Notes" = "https://github.com/yu9824/anysolv-tutorial/releases"
# Changelog = "https://github.com/yu9824/anysolv-tutorial/blob/main/CHANGELOG.md"

# [project.scripts]
# anysolv-tutorial = "anysolv_tutorial.__main__:entrypoint"

# [project.gui-scripts]
# anysolv-tutorial-gui = "anysolv_tutorial:main_gui"

[tool.setuptools]
package-dir = { "" = "src" }

# setuptools>=v69.0.0以降は、py.typed や .pyiが自動で含まれる

# __init__.__version__ を動的バージョンとして使用
# [tool.setuptools.dynamic]
# version = { attr = "anysolv_tutorial.__version__" }

[tool.setuptools.packages.find]
where = ["src/"]

[tool.setuptools_scm]
write_to = "src/anysolv_tutorial/_version.py"
